spring.application.name=splitsmart
server.address=127.0.0.1
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.tomcat.max-http-form-post-size=16KB
spring.web.resources.cache.cachecontrol.no-cache=true
server.error.include-message=never
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
splitsmart.data-directory=${SPLITSMART_DATA_DIRECTORY:data}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/splitsmart;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
